services:
  # ===== השירות ("המטופל") =====
  service:
    build: ./service
    env_file: ./service/.env.local
    environment:
      - SCENARIO=${SCENARIO:-healthy}
    network_mode: host # רשת ה-Codespace עצמו — פתרון לבעיית יציאה לאינטרנט ב-Codespaces

  # ===== הסוכן + הממשק ("הרופא") =====
  web:
    build: ./web
    env_file: ./web/.env.local
    environment:
      - SERVICE_URL=http://localhost:4000 # ברשת host, השירות זמין ב-localhost
    network_mode: host
    depends_on:
      - service
